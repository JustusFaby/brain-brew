services:

  postgres:
    image: postgres:16
    container_name: study-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: studycafe

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7
    container_name: study-redis

    ports:
      - "6379:6379"

  backend:
    build: ./backend

    container_name: study-backend

    ports:
      - "5000:5000"

    depends_on:
      - postgres

    environment:
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: studycafe
      JWT_SECRET: mysecretkey

  frontend:
    build: ./frontend

    container_name: study-frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend

volumes:
  postgres_data:
